:root{--pink:#a78bff}

.btn{clip-path:none;border-radius:12px;font-weight:600;letter-spacing:.04em;background:linear-gradient(135deg,#6fd8ff,#4b7bff);box-shadow:inset 0 0 0 1px rgba(255,255,255,.25),0 10px 30px rgba(75,123,255,.35)}

.opts:not(.g){counter-reset:o}
.opts:not(.g) .opt{display:flex;align-items:center;gap:12px}

.tw{position:relative;margin:8px 0 16px;border-radius:14px;border:1px solid rgba(82,255,184,.28);background:rgba(2,8,14,.85);box-shadow:0 0 44px rgba(82,255,184,.09);overflow:hidden;cursor:pointer}

.tl{white-space:pre-wrap;word-break:break-word}

@keyframes blink{50%{opacity:0}}
@keyframes glitch{0%,93%,100%{transform:none}94%{transform:translateX(-2px);text-shadow:2px 0 #ff6b80,-2px 0 #5fd0ff}96%{transform:translateX(2px);text-shadow:-2px 0 #ff6b80,2px 0 #5fd0ff}98%{transform:none}}

<script>
/* ===== DATA MATERI & SOAL (mudah diedit guru) ===== */
const MISI=[
{ic:"🛰️",t:"Apa Itu Jaringan Komputer?",
 brief:["<b>Jaringan komputer</b> adalah kumpulan komputer dan perangkat yang saling terhubung untuk bertukar data dan berbagi sumber daya.","Sumber daya yang bisa dibagi: <span class=kv>file</span> <span class=kv>printer</span> <span class=kv>koneksi internet</span>.","Manfaat: berbagi sumber daya, komunikasi cepat, data terpusat, dan menghemat biaya."],
 q:[
 {q:"Apa pengertian jaringan komputer?",o:["Beberapa komputer terhubung untuk bertukar data dan berbagi sumber daya","Satu komputer dengan banyak monitor","Kumpulan program antivirus","Komputer yang hanya terhubung ke listrik"],a:0,e:"Jaringan komputer = komputer dan perangkat yang saling terhubung untuk berbagi data dan sumber daya."},
 {q:"Manakah yang BUKAN manfaat jaringan komputer?",o:["Berbagi printer","Bertukar file","Membuat komputer tidak butuh listrik","Berbagi akses internet"],a:2,e:"Jaringan tidak menghilangkan kebutuhan listrik. Ketiga pilihan lain adalah manfaat nyata."},
 {q:"Satu printer di lab TKJ dipakai oleh 30 komputer. Manfaat jaringan yang dipakai adalah...",o:["Keamanan data","Berbagi sumber daya","Kecepatan prosesor","Penyimpanan awan"],a:1,e:"Printer adalah sumber daya yang dibagi lewat jaringan."}]},
{ic:"🌐",t:"Jenis Jaringan Berdasarkan Jangkauan",
 brief:["<span class=kv>PAN</span> Personal Area Network: jangkauan beberapa meter, contoh Bluetooth.","<span class=kv>LAN</span> Local Area Network: satu ruangan atau gedung, contoh lab komputer sekolah.","<span class=kv>MAN</span> Metropolitan Area Network: satu kota atau kawasan luas.","<span class=kv>WAN</span> Wide Area Network: antar kota atau negara. <b>Internet</b> adalah WAN terbesar."],
 q:[
 {q:"Jaringan komputer di dalam satu gedung sekolah termasuk jenis...",o:["PAN","LAN","MAN","WAN"],a:1,e:"Cakupan satu gedung atau ruangan adalah LAN."},
 {q:"Jaringan dengan cakupan paling luas, contohnya internet, adalah...",o:["LAN","PAN","WAN","MAN"],a:2,e:"WAN menghubungkan wilayah sangat luas, bahkan antar negara."},
 {q:"Headset Bluetooth yang tersambung ke HP adalah contoh...",o:["WAN","MAN","LAN","PAN"],a:3,e:"PAN untuk jangkauan pribadi yang sangat dekat."}]},
{ic:"🕸️",t:"Topologi Jaringan",
 brief:["<b>Topologi</b> adalah bentuk susunan atau tata letak koneksi antar perangkat jaringan.","<span class=kv>Bus</span> semua perangkat memakai satu kabel utama.","<span class=kv>Star</span> semua perangkat terhubung ke satu pusat (switch). Paling umum dipakai.","<span class=kv>Ring</span> perangkat tersusun melingkar.","<span class=kv>Mesh</span> setiap perangkat terhubung ke banyak perangkat lain, sangat tahan gangguan."],
 q:[
 {q:"Semua komputer terhubung ke satu switch di tengah. Ini topologi...",o:["Bus","Ring","Star","Mesh"],a:2,e:"Susunan terpusat pada switch atau hub adalah topologi Star."},
 {q:"Kabel utama putus dan seluruh jaringan lumpuh. Topologi ini kemungkinan...",o:["Bus","Star","Mesh","Tree"],a:0,e:"Pada topologi Bus, kabel utama adalah titik lemah."},
 {q:"Topologi yang paling tahan gangguan karena banyak jalur cadangan adalah...",o:["Bus","Mesh","Ring","Star"],a:1,e:"Mesh punya banyak jalur alternatif, tetapi biayanya mahal."}]},
{ic:"🔌",t:"Perangkat Jaringan",
 brief:["<span class=kv>NIC</span> kartu jaringan di komputer, antarmuka ke jaringan.","<span class=kv>Hub</span> mengirim data ke semua port.","<span class=kv>Switch</span> mengirim data hanya ke port tujuan berdasarkan <b>MAC address</b>.","<span class=kv>Router</span> menghubungkan jaringan yang berbeda, misalnya LAN ke internet, dan menentukan jalur paket.","<span class=kv>Access Point</span> memancarkan sinyal Wi-Fi."],

function termInit(){
 const el=$("tb");if(!el)return;let done=false,i=0;
 const mk=l=>{const d=document.createElement("div");d.className="tl "+l[0];el.appendChild(d);return d};
 const cur=()=>{const c=document.createElement("span");c.className="cur";return c};
 function all(){done=true;el.innerHTML="";let d;BOOT.forEach(l=>{d=mk(l);d.textContent=l[1]});d.appendChild(cur())}
 function line(){
  if(done||!document.body.contains(el))return;
  const l=BOOT[i++],d=mk(l),c=cur();d.appendChild(c);let k=0;const sp=l[0]==="p"?45:15;
  (function ch(){if(done||!document.body.contains(el))return;
   if(k<l[1].length){c.before(l[1][k++]);el.scrollTop=el.scrollHeight;setTimeout(ch,sp)}
   else if(i<BOOT.length){c.remove();setTimeout(line,l[0]==="p"?520:260)}})();
 }
 $("tw").onclick=()=>{if(!done)all()};
 if(matchMedia("(prefers-reduced-motion:reduce)").matches)all();else setTimeout(line,400);
}

function answer(btn,opts,q){
 if(S.ans)return;S.ans=true;
 const bs=[...stage.querySelectorAll(".opt")];bs.forEach(b=>b.disabled=true);

function gain(n){S.xp+=n;S.gain+=n;hud()}
function lose(){S.hearts--;hud();if(S.hearts<=0){setTimeout(()=>result(false),900);return true}return false}
function fly(sv,pts,done){
 const c=document.createElementNS("http://www.w3.org/2000/svg","circle");c.setAttribute("r",10);c.setAttribute("fill","#ffcf4d");sv.appendChild(c);
 let i=0,t0=null;
 function seg(ts){if(t0===null)t0=ts;const k=Math.min((ts-t0)/650,1),a=pts[i],b=pts[i+1];
  c.setAttribute("cx",a[0]+(b[0]-a[0])*k);c.setAttribute("cy",a[1]+(b[1]-a[1])*k);
  if(k<1)requestAnimationFrame(seg);else{i++;t0=null;if(i<pts.length-1)requestAnimationFrame(seg);else{c.remove();done()}}}
 requestAnimationFrame(seg);
}

  b.onclick=()=>{if(S.hearts<=0||b.disabled)return;
   if(i===k){b.disabled=true;b.classList.add("ok");const sl=$("st").children[k];sl.textContent=N[i][0];sl.classList.add("on");gain(100);k++;if(k<5)clue();else send()}
   else{b.classList.add("bad");setTimeout(()=>b.classList.remove("bad"),400);lose()}};
  $("tl").appendChild(b)});
 function send(){$("tl").remove();$("clue").innerHTML="📦 Paket sedang dikirim...";const sl=[...$("st").children];
  sl.forEach((s,j)=>setTimeout(()=>{sl.forEach(x=>x.classList.remove("hot"));s.classList.add("hot")},j*450));
  setTimeout(()=>{$("clue").remove();$("fb").innerHTML=`<div class="fb ok"><b>Paket sampai!</b> Tugasmu berhasil diunggah.</div><div class="row"><button class="btn" id="dn">Selesai</button></div>`;$("dn").onclick=()=>result(true)},5*450+200)}
}};

/* ===== LATAR JARINGAN ANIMASI ===== */
(function(){
 const c=$("bg"),x=c.getContext("2d");let w,h,st=[];
 const calm=matchMedia("(prefers-reduced-motion:reduce)").matches;
 function size(){w=c.width=innerWidth;h=c.height=innerHeight;st=Array.from({length:Math.floor(w*h/5000)},()=>({x:Math.random()*w,y:Math.random()*h,z:Math.random()*.9+.1,p:Math.random()*6.28}))}
 function draw(t){
  x.clearRect(0,0,w,h);
  for(const s of st){if(!calm){s.x-=s.z*.25;if(s.x<0){s.x=w;s.y=Math.random()*h}}
   const a=.3+.55*s.z*(calm?1:.6+.4*Math.sin(t/700+s.p));
   x.fillStyle=s.z>.8?`rgba(170,220,255,${a})`:`rgba(255,255,255,${a})`;x.fillRect(s.x,s.y,s.z*2,s.z*2)}
  if(!calm)requestAnimationFrame(draw)
 }
 addEventListener("resize",()=>{size();if(calm)draw(0)});size();draw(0);
})();
start();
</script>
